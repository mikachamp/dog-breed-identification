.dg .bx-a{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1.5}
.dg .bx-c{fill:var(--flag);fill-opacity:.08;stroke:var(--flag);stroke-width:1.4;stroke-dasharray:5 4}
.dg .lane{fill:var(--bg);fill-opacity:.5;stroke:var(--line);stroke-width:1}
.dg .lane2{fill:none;stroke:var(--line);stroke-width:1}
.dg text{font-family:var(--f-head);fill:var(--fg)}
.dg .tt{font-size:15px;font-weight:700}
.dg .t{font-size:13.5px;font-weight:600}
.dg .ts{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.dg .tc{fill:var(--flag)}
.dg .ta{fill:var(--accent)}
.dg .mid{text-anchor:middle}
.dg .end{text-anchor:end}
.dg .ln{fill:none;stroke:var(--muted);stroke-width:1.5}
.dg .ln-a{fill:none;stroke:var(--accent);stroke-width:1.6}
.dg .ln-c{fill:none;stroke:var(--flag);stroke-width:1.6;stroke-dasharray:6 4}
