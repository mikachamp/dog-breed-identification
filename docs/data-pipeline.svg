<text class="ts" x="538" y="116">10,222 rows: id, breed</text>
<rect class="bx" x="726" y="70" width="198" height="64" rx="8"/>
<text class="t" x="738" y="94">train/ folder</text>
<text class="ts" x="738" y="116">10,222 JPEGs, checked</text>

