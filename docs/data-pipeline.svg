<text class="ts" x="768" y="392">train: shuffled first,</text>
<text class="ts" x="768" y="406">256 batches</text>
<text class="ts" x="768" y="420">val: in order, 64</text>
<text class="ts" x="768" y="434">test: images only</text>
<text class="ts" x="36" y="436">training set: shuffle(buffer = whole set) runs before the map, so paths are shuffled, not decoded images</text>
