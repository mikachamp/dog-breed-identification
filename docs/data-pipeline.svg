.ch .mkl{fill:none;stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3}
</style>
<rect class="bgfill" x="0" y="0" width="960" height="470"/>

<title id="data-t">Data pipeline</title>
<desc id="data-d">The Kaggle Dog Breed Identification data is stored in Google Drive and mounted in Google Colab. labels.csv has 10,222 rows of image id and breed, and the train folder has 10,222 JPEG files; the notebook checks the counts match. The breeds are reduced to 120 unique labels and each label becomes a one-hot array of length 120. train_test_split with test size 0.2 and random state 42 splits the data into 8,177 training and 2,045 validation images. Each image is read, decoded as a 3-channel JPEG, converted to float32 between 0 and 1 and resized to 224 by 224. Training data is shuffled across the whole set, then mapped and batched in 32s, giving 256 batches. Validation data is not shuffled and gives 64 batches. Test images have no labels and are batched the same way for prediction.</desc>
<defs>
<marker id="bm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-a"/></marker>
</defs>
