<rect class="bx" x="36" y="214" width="250" height="58" rx="8"/>
<text class="t" x="48" y="237">120 unique breeds</text>
<text class="ts" x="48" y="257">np.unique → one-hot, length 120</text>
<path class="ln" d="M286,243 H312" marker-end="url(#bm)"/>
<rect class="bx-a" x="316" y="214" width="276" height="58" rx="8"/>
<text class="t" x="328" y="237">train_test_split</text>
<text class="ts" x="328" y="257">test_size=0.2 · random_state=42</text>
<path class="ln-a" d="M592,232 H636" marker-end="url(#ba)"/>
<path class="ln-a" d="M592,256 H600 V262 H780" marker-end="url(#ba)"/>
<rect class="bx" x="640" y="214" width="130" height="36" rx="6"/>
<text class="t" x="652" y="237">Train 8,177</text>
<rect class="bx" x="784" y="244" width="140" height="36" rx="6"/>
<text class="t" x="796" y="267">Validation 2,045</text>

<path class="ln" d="M480,286 V312" marker-end="url(#bm)"/>
