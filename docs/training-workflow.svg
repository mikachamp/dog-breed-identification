<text class="ts" x="572" y="420">stopped after 15 epochs (320 batches each)</text>
<path class="ln" d="M560,392 H526" marker-end="url(#cm)"/>
<rect class="bx" x="300" y="344" width="222" height="96" rx="8"/>
<text class="t" x="312" y="368">Predict</text>
<text class="ts" x="312" y="388">Kaggle test images</text>
<text class="ts" x="312" y="404">model file dated 16 Nov 2024</text>
<text class="ts" x="312" y="420">3 dog photos from the web</text>
</svg>
