<svg viewBox="0 0 1000 470" role="img" aria-labelledby="wf-t wf-d" xmlns="http://www.w3.org/2000/svg" class="dg ch" width="1000" height="470">
<style>
:root{--bg:#F3F2EE;--fg:#1D1F22;--muted:#5E636A;--line:#D9D7D0;--card:#FFFFFF;--accent:#2E6F68;--flag:#B4543C;
--f-head:"Schibsted Grotesk","Segoe UI",system-ui,sans-serif;--f-body:"Source Serif 4",Georgia,serif;--f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141617;--fg:#E4E4DF;--muted:#9AA0A6;--line:#2C2F32;--card:#1C1F21;--accent:#7FC3B9;--flag:#E58A6E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141617;--fg:#E4E4DF;--muted:#9AA0A6;--line:#2C2F32;--card:#1C1F21;--accent:#7FC3B9;--flag:#E58A6E;color-scheme:dark}
.bgfill{fill:var(--card)}
.dg .grp{fill:none;stroke:var(--line);stroke-width:1.5}
.dg .grp-c{fill:var(--flag);fill-opacity:.06;stroke:var(--flag);stroke-width:1.5;stroke-dasharray:6 5}
.dg .grp-l{fill:var(--accent);fill-opacity:.06;stroke:var(--accent);stroke-width:1.5}
.dg .grp-m{fill:var(--muted);fill-opacity:.08;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
.dg .bx{fill:var(--bg);stroke:var(--line);stroke-width:1.2}
.dg .bx-a{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1.5}
.dg .bx-c{fill:var(--flag);fill-opacity:.08;stroke:var(--flag);stroke-width:1.4;stroke-dasharray:5 4}
.dg .lane{fill:var(--bg);fill-opacity:.5;stroke:var(--line);stroke-width:1}
.dg .lane2{fill:none;stroke:var(--line);stroke-width:1}
.dg text{font-family:var(--f-head);fill:var(--fg)}
.dg .tt{font-size:15px;font-weight:700}
.dg .t{font-size:13.5px;font-weight:600}
.dg .ts{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.dg .tc{fill:var(--flag)}
.dg .ta{fill:var(--accent)}
.dg .mid{text-anchor:middle}
.dg .end{text-anchor:end}
.dg .ln{fill:none;stroke:var(--muted);stroke-width:1.5}
.dg .ln-a{fill:none;stroke:var(--accent);stroke-width:1.6}
.dg .ln-c{fill:none;stroke:var(--flag);stroke-width:1.6;stroke-dasharray:6 4}
.dg .mk{fill:var(--muted)}
.dg .mk-a{fill:var(--accent)}
.dg .mk-c{fill:var(--flag)}
.ch text{font-family:var(--f-head);fill:var(--muted);font-size:11.5px}
.ch .tk{font-family:var(--f-mono)}
.ch .lb{font-weight:600}
.ch .mid{text-anchor:middle}
.ch .end{text-anchor:end}
.ch .gd{fill:none;stroke:var(--line);stroke-width:1}
.ch .ax{fill:none;stroke:var(--muted);stroke-width:1}
.ch .tr{fill:none;stroke:var(--muted);stroke-width:2}
.ch .va{fill:none;stroke:var(--accent);stroke-width:2.4}
.ch .dtr{fill:var(--muted)}
.ch .dva{fill:var(--accent)}
.ch .tr-t{fill:var(--muted)}
.ch .va-t{fill:var(--accent)}
.ch .mkl{fill:none;stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3}
</style>
<rect class="bgfill" x="0" y="0" width="1000" height="470"/>

<title id="wf-t">Training, evaluation and experiments</title>
<desc id="wf-d">Three lanes. The run loop: build the model, fit for up to 200 epochs with TensorBoard and early stopping on validation accuracy with patience 5, evaluate on the validation set, save a .keras file to Google Drive, then compare with earlier runs. The experiments: run 1, a 5,000-image subset, 77.1%. Run 2 adds rotation and brightness augmentation, 75.2%. Runs 3 to 5 make the base trainable on the full dataset, with and without an extra ReLU layer, 44.4% to 46.1%. Run 6 freezes the base again on the full 80/20 split, 78.1%, the best. Full data: the same frozen-base architecture trained on all 10,222 images with no validation set, early stopping on training accuracy with patience 4, stopped after 15 epochs. The prediction cells load a full-data model file dated 16 November 2024, before the experiment runs, to predict the Kaggle test set and 3 dog photos from the web.</desc>
<defs>
<marker id="cm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-a"/></marker>
<marker id="cc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c"/></marker>
</defs>
<rect class="lane" x="10" y="20" width="980" height="120"/>
<rect class="lane2" x="10" y="140" width="980" height="180"/>
<rect class="lane" x="10" y="320" width="980" height="140"/>
<path class="ln" d="M120,20 V460"/>
<text class="tt" x="22" y="76">Each run</text>
<text class="tt" x="22" y="226">Experiments</text>
<text class="ts" x="22" y="244">one change</text><text class="ts" x="22" y="258">at a time</text>
<text class="tt" x="22" y="386">Full data</text>

<rect class="bx" x="134" y="44" width="140" height="72" rx="8"/>
<text class="t" x="146" y="68">Build</text><text class="ts" x="146" y="88">create_model()</text><text class="ts" x="146" y="104">base + head</text>
<path class="ln" d="M274,80 H290" marker-end="url(#cm)"/>
<rect class="bx" x="294" y="44" width="200" height="72" rx="8"/>
<text class="t" x="306" y="68">Fit, up to 200 epochs</text><text class="ts" x="306" y="88">TensorBoard logs</text><text class="ts" x="306" y="104">stop: val_accuracy, 5</text>
<path class="ln" d="M494,80 H510" marker-end="url(#cm)"/>
<rect class="bx" x="514" y="44" width="150" height="72" rx="8"/>
<text class="t" x="526" y="68">Evaluate</text><text class="ts" x="526" y="88">model.evaluate</text><text class="ts" x="526" y="104">on validation</text>
<path class="ln" d="M664,80 H680" marker-end="url(#cm)"/>
<rect class="bx" x="684" y="44" width="140" height="72" rx="8"/>
<text class="t" x="696" y="68">Save</text><text class="ts" x="696" y="88">.keras file</text><text class="ts" x="696" y="104">on Google Drive</text>
<path class="ln" d="M824,80 H840" marker-end="url(#cm)"/>
<rect class="bx" x="844" y="44" width="136" height="72" rx="8"/>
<text class="t" x="856" y="68">Compare</text><text class="ts" x="856" y="88">with earlier</text><text class="ts" x="856" y="104">runs</text>

<rect class="bx" x="134" y="160" width="190" height="72" rx="8"/>
<text class="t" x="146" y="184">Run 1 · baseline</text><text class="ts" x="146" y="204">5,000-image subset</text><text class="ts" x="146" y="220">77.1% val</text>
<path class="ln" d="M324,196 H340" marker-end="url(#cm)"/>
<rect class="bx" x="344" y="160" width="190" height="72" rx="8"/>
<text class="t" x="356" y="184">Run 2 · augmentation</text><text class="ts" x="356" y="204">rotation + brightness</text><text class="ts" x="356" y="220">75.2% val</text>
<path class="ln" d="M534,196 H550" marker-end="url(#cm)"/>
<rect class="bx-c" x="554" y="160" width="200" height="72" rx="8"/>
<text class="t" x="566" y="184">Runs 3–5 · fine-tune</text><text class="ts" x="566" y="204">base trainable, full data</text><text class="ts tc" x="566" y="220">44.4–46.1% val</text>
<path class="ln-a" d="M754,196 H770" marker-end="url(#ca)"/>
